<body>
<header class="top">
  <div class="brand">
    <div class="t1">职业技能等级认定平台 · 业务流程图（六图）</div>
    <div class="t2">依据《技术协议（招标文件）》第一部分技术要求绘制 · 与甲方逐节点确认稿 · 核对日期 <b>2026-09-21</b></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>
<div class="foot">图形语义：【明确】实线框＝协议直接规定；【编排】圆角／汇合点＝业务衔接；【待确认】虚线框＝执行人、时点或路径未明确，不作为已确认开发规则。</div>

<script>
/* ===================== 全局常量 ===================== */
var GEO = {
  NODE_W: 248, NODE_H: 78, GAP: 18, COL_W: 360, LANE_W: 208,
  TOP_PAD: 60, BOT_GAP: 58, BAND_H: 50, LEFT: 22, RIGHT: 44,
  D_W: 336, D_H: 144, ROW: 98
};
/* 字号与线宽集中定义，便于整体调节清晰度 */
var FS = {
  node: 15.5, nodeLH: 20, dec: 15, decLH: 20, id: 11, tag: 11,
  edge: 12.5, edgeLH: 15, lane: 14, laneLH: 18, band: 15, misc: 12.5
};
var LW = { node: 2.2, edge: 2.1, back: 2.1, lane: 1.4, band: 1.6 };
var C = {
  manual:   { f:'#E4EFFA', s:'#1C6FB0', i:'#08304C', tag:'' },
  system:   { f:'#DFF2ED', s:'#0E7A6A', i:'#053A31', tag:'系统' },
  start:    { f:'#E7F5E2', s:'#357E38', i:'#173F19', tag:'' },
  end:      { f:'#DCEBE5', s:'#256352', i:'#123028', tag:'' },
  decision: { f:'#FFF3DC', s:'#C07C08', i:'#5C3A00', tag:'' },
  uncertain:{ f:'#F4EBFC', s:'#7345AC', i:'#3C1C61', tag:'待确认' },
  external: { f:'#E9EBF9', s:'#4A51AE', i:'#20245F', tag:'关联' },
  event:    { f:'#FCE4E1', s:'#B32B1C', i:'#6B1509', tag:'事件' }
};
var SVGNS = 'http://www.w3.org/2000/svg';

/* ===================== 基础工具 ===================== */
function A(tag, attrs, parent){
  var e = document.createElementNS(SVGNS, tag);
  if(attrs) for(var k in attrs){ if(attrs[k]!==undefined && attrs[k]!==null) e.setAttribute(k, attrs[k]); }
  if(parent) parent.appendChild(e);
  return e;
}
function H(tag, attrs, parent){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(attrs[k]===undefined || attrs[k]===null) continue;
    if(k === 'html') e.innerHTML = attrs[k];
    else if(k === 'cls') e.className = attrs[k];
    else if(k === 'text') e.textContent = attrs[k];
    else if(k.indexOf('on') === 0 && typeof attrs[k] === 'function') e[k] = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  if(parent) parent.appendChild(e);
  return e;
}
function chunk(s, n){
  var out = [], str = String(s);
  for(var i=0;i<str.length;i+=n) out.push(str.slice(i,i+n));
  return out;
}
function lines(s, maxChars, maxLines){
  var parts = String(s).split('\n'), out = [];
  for(var i=0;i<parts.length;i++) out = out.concat(chunk(parts[i], maxChars));
  if(out.length > maxLines){ out = out.slice(0, maxLines); out[maxLines-1] = out[maxLines-1].slice(0, -1) + '…'; }
  return out;
}
/* 横向带文字专用折行：优先在“｜／|／、”处断开，避免把词劈开 */
function bandLinesOf(s, per){
  var segs = String(s).split(/[｜|]/), packed = [], cur = '';
  for(var i=0;i<segs.length;i++){
    var piece = (i ? '｜' : '') + segs[i];
    if(cur && (cur + piece).length > per){ packed.push(cur); cur = piece; }
    else cur += piece;
  }
  if(cur) packed.push(cur);
  var res = [];
  for(i=0;i<packed.length;i++) res = res.concat(chunk(packed[i], per));
  /* 避免把“｜”留在行尾 */
  for(i=0;i<res.length-1;i++){
    if(/[｜|]$/.test(res[i])){ res[i+1] = '｜' + res[i+1]; res[i] = res[i].slice(0, -1); }
  }
  return res;
}
function txt(parent, x, y, str, o){
  o = o || {};
  var t = A('text', {
    x: x, y: y, fill: o.fill || '#1F2328', 'font-size': o.fs || 13,
    'text-anchor': o.anchor || 'middle', 'dominant-baseline': 'middle',
    'font-weight': o.fw || 400, 'letter-spacing': o.ls || 0
  }, parent);
  if(o.halo) t.setAttribute('style', 'paint-order:stroke;stroke:' + (o.haloColor||'#fff') + ';stroke-width:' + o.halo + 'px;stroke-linejoin:round');
  t.textContent = str;
  return t;
}
function blockText(parent, cx, cy, str, maxChars, o){
  o = o || {};
  var ls = lines(str, maxChars, o.maxLines || 3), lh = o.lh || 15;
  var y0 = cy - (ls.length - 1) * lh / 2;
  for(var i=0;i<ls.length;i++) txt(parent, cx, y0 + i*lh, ls[i], o);
}

/* ===================== 布局计算 ===================== */
function allColsOf(f){
  var set = {}, cols = [], i;
  for(i=0;i<f.nodes.length;i++){ if(!set[f.nodes[i].col]){ set[f.nodes[i].col] = 1; cols.push(f.nodes[i].col); } }
  cols.sort(function(a,b){ return a-b; });
  return cols;
}
var SEG_COLS = 5;                     /* 分段精读：每段列数 */
function segmentsOf(f){
  var cols = allColsOf(f), out = [], i;
  for(i=0;i<cols.length;i+=SEG_COLS){
    var part = cols.slice(i, i + SEG_COLS);
    out.push({ c1: part[0], c2: part[part.length-1], cols: part });
  }
  return out;
}
function segIndexOf(col, segs){
  for(var i=0;i<segs.length;i++){ if(col >= segs[i].c1 && col <= segs[i].c2) return i; }
  return -1;
}

/* win：null＝全景；{c1,c2}＝分段窗口（按全局列号）
   opts.hideIdle：分段时隐藏本段无节点的泳道，画面更紧凑、可读性更高 */
function layout(f, win, opts){
  opts = opts || {};
  var lanes = f.lanes, i, j, n;
  var colsAll = allColsOf(f);
  var cols = win ? colsAll.filter(function(c){ return c >= win.c1 && c <= win.c2; }) : colsAll.slice();
  var colIdx = {}; for(i=0;i<cols.length;i++) colIdx[cols[i]] = i;

  var vis = [], visSet = {};
  for(i=0;i<f.nodes.length;i++){ if(colIdx[f.nodes[i].col] !== undefined){ vis.push(f.nodes[i]); visSet[f.nodes[i].id] = 1; } }
  var laneUsed = {};
  for(i=0;i<vis.length;i++) laneUsed[vis[i].lane] = 1;

  /* 行数按全图计算，保证节点叠层次序稳定 */
  var byLane = [];
  for(i=0;i<lanes.length;i++) byLane.push([]);
  for(i=0;i<f.nodes.length;i++){ n = f.nodes[i]; (byLane[n.lane] = byLane[n.lane] || []).push(n); }

  var info = [], hidden = [];
  for(i=0;i<lanes.length;i++){
    var groups = {}, maxRows = 1, maxH = GEO.NODE_H;
    for(j=0;j<byLane[i].length;j++){
      var nd = byLane[i][j], k = nd.col;
      (groups[k] = groups[k] || []).push(nd);
      maxH = Math.max(maxH, nd.type === 'decision' ? GEO.D_H : GEO.NODE_H);
    }
    for(var g in groups) maxRows = Math.max(maxRows, groups[g].length);
    info.push({ name: lanes[i], groups: groups, rows: maxRows, rowH: maxH + GEO.GAP, maxH: maxH, hidden: false });
  }
  var y = GEO.TOP_PAD;
  for(i=0;i<info.length;i++){
    if(opts.hideIdle && !laneUsed[i]){
      info[i].hidden = true; info[i].top = y; info[i].h = 0; info[i].dip = y; hidden.push(lanes[i]);
      continue;
    }
    info[i].top = y;
    info[i].h = info[i].rows * info[i].rowH + GEO.GAP;
    info[i].dip = info[i].top + GEO.GAP / 2 + info[i].rows * info[i].rowH - 14;
    y += info[i].h;
  }
  var lanesH = y - GEO.TOP_PAD;
  var lanesBottom = y;

  var x0 = GEO.LANE_W + GEO.LEFT;
  for(i=0;i<vis.length;i++){
    n = vis[i];
    var li = info[n.lane];
    var grp = li.groups[n.col];
    var idx = grp.indexOf(n);
    var isD = n.type === 'decision';
    var w = isD ? GEO.D_W : GEO.NODE_W, h = isD ? GEO.D_H : GEO.NODE_H;
    var cx = x0 + colIdx[n.col] * GEO.COL_W + GEO.NODE_W / 2;
    n._cx = cx; n._w = w; n._h = h;
    n._x = cx - w / 2;
    n._y = li.top + GEO.GAP / 2 + idx * li.rowH + (li.maxH - h) / 2;
  }
  var W = x0 + (cols.length - 1) * GEO.COL_W + GEO.NODE_W / 2 + GEO.D_W / 2 + GEO.RIGHT;
  /* 全程横向带文字按画布宽度折行，避免被截断 */
  var bandChars = Math.max(24, Math.floor((W - GEO.LANE_W - 46) / (FS.band * 1.02)));
  var bandLines = bandLinesOf(f.band, bandChars);
  var bandH = Math.max(GEO.BAND_H, 20 + bandLines.length * 22);
  var bandY = lanesBottom + GEO.BOT_GAP;
  var Hh = bandY + bandH + 30 + (opts.hideIdle && hidden.length ? 34 : 0);
  return { info: info, lanesH: lanesH, lanesBottom: lanesBottom, W: W, H: Hh, bandY: bandY, bandH: bandH,
           bandChars: bandChars, bandLines: bandLines, x0: x0,
           cols: cols, colIdx: colIdx, vis: vis, visSet: visSet, hidden: hidden };
}

/* ===================== 连线路由 ===================== */
function colLeftOf(L, col){ return L.x0 + L.cols.indexOf(col) * GEO.COL_W; }
function countBetween(f, lane, c1, c2){
  var n = 0, a = f.nodes;
  for(var i=0;i<a.length;i++){ if(a[i].lane === lane && a[i].col > c1 && a[i].col < c2) n++; }
  return n;
}
function route(s, t, L, f){
  var scy = s._y + s._h/2, tcy = t._y + t._h/2;
  var sr = s._x + s._w, tl = t._x, scx = s._x + s._w/2, tcx = t._x + t._w/2;
  var o = { back: false };
  var colGap = t.col - s.col;

  if(colGap === 0){
    if(t.lane > s.lane){
      o.d = 'M ' + scx + ' ' + (s._y + s._h) + ' L ' + tcx + ' ' + (t._y - 7);
      o.lp = [ scx + 8, (s._y + s._h + t._y) / 2 ];
    } else {
      o.d = 'M ' + scx + ' ' + s._y + ' L ' + tcx + ' ' + (t._y + t._h + 7);
      o.lp = [ scx + 8, (s._y + t._y + t._h) / 2 ];
    }
    return o;
  }

  if(colGap > 0){
    if(s.lane === t.lane){
      if(colGap === 1){
        o.d = 'M ' + sr + ' ' + scy + ' L ' + (tl - 7) + ' ' + tcy;
        o.lp = [ (sr + tl) / 2, scy - 9 ];
      } else {
        var li = L.info[s.lane];
        var nb = (L.dipN[s.lane] = (L.dipN[s.lane] || 0)); L.dipN[s.lane] = (nb + 1) % 3;
        var dy = li.dip + nb * 5;
        o.d = 'M ' + sr + ' ' + scy + ' L ' + (sr + 16) + ' ' + scy + ' L ' + (sr + 16) + ' ' + dy +
              ' L ' + (tl - 16) + ' ' + dy + ' L ' + (tl - 16) + ' ' + tcy + ' L ' + (tl - 7) + ' ' + tcy;
        o.lp = [ (sr + tl) / 2, dy + 9 ];
      }
      return o;
    }
    var nSrc = countBetween(f, s.lane, s.col, t.col);
    var nTgt = countBetween(f, t.lane, s.col, t.col);
    var vx, hx;
    if(nSrc <= nTgt){
      vx = colLeftOf(L, t.col) - 40;
      hx = [ (sr + vx) / 2, scy - 9 ];
    } else {
      vx = colLeftOf(L, s.col) + (GEO.COL_W - 40);
      hx = [ (vx + tl) / 2, tcy - 9 ];
    }
    o.d = 'M ' + sr + ' ' + scy + ' L ' + vx + ' ' + scy + ' L ' + vx + ' ' + tcy + ' L ' + (tl - 7) + ' ' + tcy;
    o.lp = hx;
    return o;
  }

  // 反向：循环／返工
  o.back = true;
  var useTop = (t.lane > s.lane);
  var bx = colLeftOf(L, t.col) - 40;
  var yc, tailY;
  if(useTop){
    yc = 10 + (L.tv = ((L.tv || 0) + 1) % 4) * 8;
    tailY = t._y - 24;
    o.d = 'M ' + scx + ' ' + s._y + ' L ' + scx + ' ' + yc + ' L ' + bx + ' ' + yc + ' L ' + bx + ' ' + tailY +
          ' L ' + tcx + ' ' + tailY + ' L ' + tcx + ' ' + (t._y - 7);
    o.lp = [ (scx + bx) / 2, yc - 8 ];
  } else {
    yc = L.lanesBottom + 12 + (L.bv = ((L.bv || 0) + 1) % 4) * 8;
    tailY = t._y + t._h + 24;
    o.d = 'M ' + scx + ' ' + (s._y + s._h) + ' L ' + scx + ' ' + yc + ' L ' + bx + ' ' + yc + ' L ' + bx + ' ' + tailY +
          ' L ' + tcx + ' ' + tailY + ' L ' + tcx + ' ' + (t._y + t._h + 7);
    o.lp = [ (scx + bx) / 2, yc + 9 ];
  }
  return o;
}

/* ===================== 绘制单图 ===================== */
/* win＝列窗口（null 为全景）；segs＝该图分段表，用于计算“续第几段” */
function buildSvg(f, win, segs, opts){
  var L = layout(f, win, opts), i, n;
  L.tv = 0; L.bv = 0; L.dipN = {};
  var svg = A('svg', { xmlns: SVGNS, viewBox: '0 0 ' + L.W + ' ' + L.H, width: L.W, height: L.H,
    'font-family': '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif' });
  var defs = A('defs', {}, svg);
  var marks = [ ['n', '#49535F'], ['b', '#8A93A0'], ['u', '#7345AC'], ['s', '#C2610C'] ];
  for(i=0;i<marks.length;i++){
    var m = A('marker', { id: 'ar-' + marks[i][0] + '-' + f.key, viewBox: '0 0 10 10', refX: 9, refY: 5,
      markerWidth: 9, markerHeight: 9, orient: 'auto-start-reverse' }, defs);
    A('path', { d: 'M0,0 L10,5 L0,10 z', fill: marks[i][1] }, m);
  }
  var bg = A('g', {}, svg);
  // 泳道
  var shown = 0;
  for(i=0;i<L.info.length;i++){
    var li = L.info[i];
    if(li.hidden) continue;
    A('rect', { x: 0, y: li.top, width: L.W, height: li.h, fill: shown % 2 ? '#FBF9F6' : '#FFFFFF' }, bg);
    A('rect', { x: 0, y: li.top, width: GEO.LANE_W, height: li.h, fill: '#F4F2ED', stroke: '#DEDBD4', 'stroke-width': LW.lane }, bg);
    A('line', { x1: 0, y1: li.top, x2: L.W, y2: li.top, stroke: '#DEDBD4', 'stroke-width': LW.lane }, bg);
    blockText(bg, GEO.LANE_W/2, li.top + li.h/2, li.name, 12,
      { fs: FS.lane, lh: FS.laneLH, fill: '#2E3742', maxLines: 4, fw: 600 });
    shown++;
  }
  A('line', { x1: GEO.LANE_W, y1: GEO.TOP_PAD, x2: GEO.LANE_W, y2: L.lanesBottom, stroke: '#DEDBD4', 'stroke-width': LW.lane }, bg);

/* 跨段截断标注：把连到窗外节点的边画成一段引出／引入短线，返回衔接说明 */
function drawStub(g, f, ed, s, t, inS, L, segs, xL, xR, u){
  var col = u ? '#7345AC' : '#C2610C';
  var y, d, out;
  if(inS){
    y = s._y + s._h/2;
    var toRight = t.col > s.col;
    d = toRight ? ('M ' + (s._x + s._w) + ' ' + y + ' L ' + (xR - 4) + ' ' + y)
                : ('M ' + s._x + ' ' + y + ' L ' + (xL + 4) + ' ' + y);
    out = { dir: 'out', id: t.id, seg: segs ? segIndexOf(t.col, segs) + 1 : 0 };
  } else {
    y = t._y + t._h/2;
    var fromLeft = s.col < t.col;
    d = fromLeft ? ('M ' + (xL + 4) + ' ' + y + ' L ' + (t._x - 2) + ' ' + y)
                 : ('M ' + (xR - 4) + ' ' + y + ' L ' + (t._x + t._w + 2) + ' ' + y);
    out = { dir: 'in', id: s.id, seg: segs ? segIndexOf(s.col, segs) + 1 : 0 };
  }
  A('path', { d: d, fill: 'none', stroke: col, 'stroke-width': 2.1, 'stroke-dasharray': '11 6',
    'marker-end': 'url(#ar-' + (u ? 'u' : 's') + '-' + f.key + ')', 'stroke-linecap': 'round' }, g);

function continuityText(svg, xL, stubs){

  var ins = [], outs = [], i, x;
  for(i=0;i<stubs.length;i++){

    var head = a.slice(0, 4).map(function(z){ return z.id + '（第' + z.seg + '段）'; }).join('、');

  var s = '本段衔接：上线 ← ' + fmt(ins) + '　｜　下线 → ' + fmt(outs);

/* 浏览器画布上限保护：单边 ≤ 16000px，总面积 ≤ 2.6 亿像素 */
function safeMult(w, h, req){
  var m = req;
  m = Math.min(m, 16000 / w, 16000 / h);
  var area = 260000000;
  if(w * h * m * m > area) m = Math.sqrt(area / (w * h));
  return Math.max(1, Math.floor(m * 100) / 100);
}
function svgToPng(svg, w, h, mult, name, onDone){

  var pre = A('rect', { x: 0, y: 0, width: w, height: h, fill: '#ffffff' });
  clone.insertBefore(pre, clone.firstChild);
  var str = new XMLSerializer().serializeToString(clone);
  var img = new Image();
  img.onload = function(){
    var cv = document.createElement('canvas');
    cv.width = Math.round(w * k); cv.height = Math.round(h * k);
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, cv.width, cv.height);

      a.href = URL.createObjectURL(b); a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      onDone && onDone(cv.width, cv.height);
    }, 'image/png');
  };
  img.onerror = function(){ onDone && onDone(0, 0); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
}

function exportPng(f){
  var c = document.querySelector('.canvas'), svg = c && c.querySelector('svg');
  if(!svg){ setMsg('未找到图形'); return; }
  var segs = segmentsOf(f);
  var inSeg = state.mode === 'seg';
  var vb = svg.getAttribute('viewBox').split(' ');
  var w = parseFloat(vb[2]), h = parseFloat(vb[3]);
  var req = state.multOf[f.key] || 2;
  var name = f.key + (inSeg ? '_第' + (state.segOf[f.key]+1) + '段' : '_全景') + '.png';
  setMsg('正在导出…');
  svgToPng(svg, w, h, req, name, function(pw, ph){
    if(!pw){ setMsg('导出失败，请改用“打印 / 存为 PDF”。'); return; }
    var k = pw / w;
    setMsg(f.key + (inSeg ? ' 第' + (state.segOf[f.key]+1) + '段' : ' 全景') + ' 已导出 ' + pw + '×' + ph + ' px（' + (k === 1 ? '已按浏览器上限降为 1 倍' : k.toFixed(2).replace(/\.00$/,'') + ' 倍') + '）');
  });
}

/* 矢量分页打印：整张图按段分页，每页 A4 横向；另存为 PDF 即得高清矢量文件 */
function printAll(f){
  var segs = segmentsOf(f);
  var list = segs;
  var w = window.open('', '_blank');
  if(!w){ setMsg('浏览器拦截了新窗口，请允许弹出窗口后重试。'); return; }
  var parts = [];
  parts.push('<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>' + f.key + ' ' + f.title + ' — 分段矢量图</title>');
  parts.push('<style>@page{size:A4 landscape;margin:8mm}html,body{margin:0;padding:0;background:#fff;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}');
  parts.push('.pg{page-break-after:always;padding:2mm 0}.pg:last-child{page-break-after:auto}');
  parts.push('.hd{font-size:11pt;font-weight:700;color:#1F2328;margin:0 0 2mm}.hd i{font-style:normal;color:#A0520A}');
  parts.push('.pg svg{width:100%;height:auto;display:block}</style></head><body>');
  for(var i=0;i<list.length;i++){
    var b = buildSvg(f, list[i], segs, { hideIdle: true });
    var s = new XMLSerializer().serializeToString(b.svg);
    var si = segIndexOf(list[i].c1, segs);
    var ids = f.nodes.filter(function(x){ return x.col >= list[i].c1 && x.col <= list[i].c2; }).map(function(x){ return x.id; });
    parts.push('<div class="pg"><div class="hd">' + f.key + '　' + f.title + '　<i>第 ' + (si+1) + ' / ' + segs.length + ' 段（' + ids[0] + ' — ' + ids[ids.length-1] + '）</i></div>' + s + '</div>');
  }
  parts.push('</body></html>');
  w.document.open(); w.document.write(parts.join('')); w.document.close();
  setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} }, 600);
}

function table(parent, rows){
  var t = H('table', {}, parent);
  for(var i=0;i<rows.length;i++){
    var cells = rows[i].split('|'), tr = H('tr', {}, t);
    for(var j=0;j<cells.length;j++){
      var c = H(i === 0 ? 'th' : 'td', {}, tr);
      if(i === 0) c.textContent = cells[j];
      else if(j === 0) H('span', { cls: 'k', text: cells[j] }, c);
      else c.textContent = cells[j];
    }
  }
  return t;
}

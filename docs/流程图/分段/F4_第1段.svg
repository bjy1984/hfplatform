<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2006 588" width="2006" height="588" font-family="&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif"><defs><marker id="ar-n-F4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#49535F"></path></marker><marker id="ar-b-F4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A0"></path></marker><marker id="ar-u-F4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7345AC"></path></marker><marker id="ar-s-F4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2610C"></path></marker></defs><rect x="0" y="0" width="2006" height="588" fill="#ffffff"></rect><text x="18" y="32" font-size="19" font-weight="700" fill="#1F2328">F4　客观判分、主观阅卷、差值仲裁与成绩处理流程　第 1 段</text><text x="1988" y="32" font-size="13" fill="#7A828C" text-anchor="end">第 1 / 5 段（F4-S — F4-05） · 节点 7 · 本段未参与泳道已隐藏 · 核对稿 2026-09-21</text><line x1="0" y1="42" x2="2006" y2="42" stroke="#DEDBD4" stroke-width="2"></line><g transform="translate(0,48)"><g><rect x="0" y="60" width="2006" height="180" fill="#FFFFFF"></rect><rect x="0" y="60" width="208" height="180" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="60" x2="2006" y2="60" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="150" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">考试系统／系统自动处理</text><rect x="0" y="240" width="2006" height="114" fill="#FBF9F6"></rect><rect x="0" y="240" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="240" x2="2006" y2="240" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="297" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">阅卷组织管理人员</text><line x1="208" y1="60" x2="208" y2="354" stroke="#DEDBD4" stroke-width="1.4"></line><line x1="0" y1="354" x2="2006" y2="354" stroke="#DEDBD4" stroke-width="1.4"></line></g><g><rect x="0" y="412" width="2006" height="64" fill="#FFF2E0" stroke="#E0A162" stroke-width="1.6"></rect><text x="14" y="444" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">全程横向带</text><text x="216" y="433" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">按试题、专家、评分组监控进度｜判分质量与效率统计｜任务分配和调整追溯｜阅卷及考核多维统计｜判分结果开放｜电子签字留痕（2.3.18—19、2.4.8）</text><text x="216" y="455" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜管理指标和任务状态实时呈现，不放到全部阅卷结束后才查看；评分组是组织单元，不能自动新增“评分组长”审批节点</text></g><g><path d="M 478 141 L 583 141" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F4)" stroke-linejoin="round" stroke-linecap="round"></path><text x="534" y="124.5" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">存在客观题，自动</text><text x="534" y="139.5" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">判分</text><path d="M 478 141 L 494 141 L 494 217 L 890 217 L 890 141 L 899 141" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F4)" stroke-linejoin="round" stroke-linecap="round"></path><text x="692" y="226" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">判断是否需要人工阅卷</text><path d="M 838 288 L 943 288" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F4)" stroke-linejoin="round" stroke-linecap="round"></path><text x="894" y="271.5" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">准备阅卷人员、模</text><text x="894" y="286.5" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">式、核分和仲裁…</text><path d="M 1198 288 L 1303 288" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F4)" stroke-linejoin="round" stroke-linecap="round"></path><path d="M 1558 288 L 1663 288" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F4)" stroke-linejoin="round" stroke-linecap="round"></path></g><g><path d="M 1918 288 L 1984 288" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F4)" stroke-linecap="round"></path><path d="M 1242 141 L 1984 141" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F4)" stroke-linecap="round"></path><path d="M 1242 141 L 1984 141" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F4)" stroke-linecap="round"></path></g><g><g class="node cfm" data-id="F4-S"><rect x="230" y="102" width="248" height="78" rx="39" fill="#E7F5E2" stroke="#357E38" stroke-width="2.2"></rect><text x="354" y="125" fill="#173F19" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">接收考试作答、评分标准及考</text><text x="354" y="145" fill="#173F19" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">试关联信息</text><text x="240" y="168" fill="#357E38" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-S</text></g><g class="node cfm" data-id="F4-01"><rect x="590" y="102" width="248" height="78" rx="9" fill="#DFF2ED" stroke="#0E7A6A" stroke-width="2.2"></rect><text x="714" y="135" fill="#053A31" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">对客观题自动判分并形成成绩</text><text x="600" y="168" fill="#0E7A6A" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-01</text><text x="828" y="168" fill="#0E7A6A" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">系统</text></g><g class="node cfm" data-id="F4-02"><rect x="590" y="249" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="714" y="282" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">组织评分专家资源</text><text x="600" y="315" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-02</text><text x="828" y="315" fill="#7345AC" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-Q1</text></g><g class="node cfm" data-id="F4-D1"><polygon points="906,141 1074,69 1242,141 1074,213" fill="#FFF3DC" stroke="#C07C08" stroke-width="2.2"></polygon><text x="1074" y="127" fill="#5C3A00" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">是否存在需要人工评阅的主观题</text><text x="1074" y="147" fill="#5C3A00" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">？</text><text x="1074" y="205" fill="#C07C08" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-D1</text></g><g class="node cfm" data-id="F4-03"><rect x="950" y="249" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="1074" y="272" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">设置阅卷维度、判分方式及保</text><text x="1074" y="292" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">密阅卷模式</text><text x="960" y="315" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-03</text><text x="1188" y="315" fill="#7345AC" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-Q2</text></g><g class="node cfm" data-id="F4-04"><rect x="1310" y="249" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="1434" y="282" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">设置核分规则</text><text x="1320" y="315" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-04</text><text x="1548" y="315" fill="#7345AC" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-Q3</text></g><g class="node cfm" data-id="F4-05"><rect x="1670" y="249" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="1794" y="272" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">按试卷或试题设置评分差值阈</text><text x="1794" y="292" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">值</text><text x="1680" y="315" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-05</text><text x="1908" y="315" fill="#7345AC" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-Q4</text></g></g><line x1="222" y1="6" x2="222" y2="354" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><line x1="1988" y1="6" x2="1988" y2="354" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><text x="228" y="16" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">◀ 本段起点（第 1 段）</text><text x="1982" y="16" fill="#A0520A" font-size="13" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">本段终点 ▶</text><text x="228" y="42" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600" letter-spacing="0">本段衔接：上线 ← 无　｜　下线 → F4-06（第2段）、F4-08（第2段）、F4-18（第4段）</text><rect x="0" y="485" width="2006" height="30" fill="#F4F2ED"></rect><text x="216" y="500" fill="#6B7480" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">本段未参与（为便于阅读已隐藏）：阅卷专家／评分人员、按试题设置的仲裁人员、成绩及归档业务使用者／考生、集团职业技能等级认定信息管理系统</text></g></svg>
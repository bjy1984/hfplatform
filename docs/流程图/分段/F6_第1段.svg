/line><text x="104" y="264" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">电子书管理员</text><rect x="0" y="354" width="2006" height="114" fill="#FFFFFF"></rect><rect x="0" y="354" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="354" x2="2006" y2="354" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="411" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">系统自动处理</text><line x1="208" y1="60" x2="208" y2="468" stroke="#DEDBD4" stroke-width="1.4"></line><line x1="0" y1="468" x2="2006" y2="468" stroke="#DEDBD4" stroke-width="1.4"></line></g><g><rect x="0" y="526" width="2006" height="64" fill="#FFF2E0" stroke="#E0A162" stroke-width="1.6"></rect><text x="14" y="558" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">全程横向带</text><text x="216" y="547" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">资源交付要求框：不少于 500 本中文优质正版数字图书，覆盖航空航天、智能制造、工业技术、人文、社科、人力资源等类别（此数量是交付验收要求，不是阅读步骤；不应出现“先上传满 500 本才允许发布第一本”之类协议未规定的门槛）</text><text x="216" y="569" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜上传、发布、维护、下架、删除操作均保留可追溯的操作日志</text></g><g><path d="M 478 108 L 550 108 L 550 255 L 583 255" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F6)" stroke-linejoin="round" stroke-linecap="round"></path><path d="M 838 255 L 910 255 L 910 402 L 943 402" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F6)" stroke-linejoin="round" stroke-linecap="round"></path><path d="M 838 255 L 943 255" fill="none" stroke="#7345AC" stroke-width="2.1" stroke-dasharray="8 5" marker-end="url(#ar-u-F6)" stroke-linejoin="round" stroke-linecap="round"></path><text x="894" y="238.5" fill="#5C3487" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">上传失败、文件不</text><text x="894" y="253.5" fill="#5C3487" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">可用等</text><path d="M 1198 402 L 1270 402 L 1270 255 L 1303 255" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F6)" stroke-linejoin="round" stroke-linecap="round"></path><path d="M 1558 255 L 1630 255 L 1630 402 L 1663 402" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F6)" stroke-linejoin="round" stroke-linecap="round"></path><text x="1594" y="246" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">发布后可查看学习</text><path d="M 1198 402 L 1630 402 L 1630 255 L 1663 255" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F6)" stroke-linejoin="round" stroke-linecap="round"></path><text x="1414" y="393" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">资源需要维护</text><path d="M 1558 255 L 1663 255" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F6)" stroke-linejoin="round" stroke-linecap="round"></path><text x="1614" y="246" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">资源需要维护</text></g><g><path d="M 1918 402 L 1984 402" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F6)" stroke-linecap="round"></path><path
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2006 812" width="2006" height="812" font-family="&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif"><defs><marker id="ar-n-F3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#49535F"></path></marker><marker id="ar-b-F3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A0"></path></marker><marker id="ar-u-F3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7345AC"></path></marker><marker id="ar-s-F3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2610C"></path></marker></defs><rect x="0" y="0" width="2006" height="812" fill="#ffffff"></rect><text x="18" y="32" font-size="19" font-weight="700" fill="#1F2328">F3　无纸化理论考试组织、核验、作答与交卷流程　第 2 段</text><text x="1988" y="32" font-size="13" fill="#7A828C" text-anchor="end">第 2 / 5 段（F3-06 — F3-D2） · 节点 6 · 本段未参与泳道已隐藏 · 核对稿 2026-09-21</text><line x1="0" y1="42" x2="2006" y2="42" stroke="#DEDBD4" stroke-width="2"></line><g transform="translate(0,48)"><g><rect x="0" y="60" width="2006" height="114" fill="#FFFFFF"></rect><rect x="0" y="60" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="60" x2="2006" y2="60" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="117" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">考生</text><rect x="0" y="174" width="2006" height="180" fill="#FBF9F6"></rect><rect x="0" y="174" width="208" height="180" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="174" x2="2006" y2="174" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="255" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">系统自动处理／受控考试环</text><text x="104" y="273" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">境</text><rect x="0" y="354" width="2006" height="180" fill="#FFFFFF"></rect><rect x="0" y="354" width="208" height="180" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="354" x2="2006" y2="354" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="444" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">异常处理责任人员</text><line x1="208" y1="60" x2="208" y2="534" stroke="#DEDBD4" stroke-width="1.4"></line><line x1="0" y1="534" x2="2006" y2="534" stroke="#DEDBD4" stroke-width="1.4"></line></g><g><rect x="0" y="592" width="2006" height="108" fill="#FFF2E0" stroke="#E0A162" stroke-width="1.6"></rect><text x="14" y="646" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">全程横向带</text><text x="216" y="613" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">本人核验（考前／考中／考后人脸识别，间隔可配置，手机同步，公安接口可对接）｜访问与时间控制（指定 IP、迟到 30 分钟禁考、开考 15 分钟禁交、考试倒计时）</text><text x="216" y="635" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜考试环境控制（限制离开考试环境、禁止打开非考试相关软件、防切屏／防截屏／防录屏／防远程控制／防可疑软件）｜试题控制（禁止复制试卷内容、机位自动绑定、题序与选项乱序）</text><text x="216" y="657" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜输入及交互（微软／谷歌／搜狗拼音、极品五笔、万能五笔等主流输入法；字号、计算器、标记、多次交卷确认及签字）｜异常连续性（保留作答、断点续考，覆盖手机端）</text><text x="216" y="679" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜容量旁注：至少 2000 人同时在线访问及考试（并发是性能验收约束，不是流程节点）</text></g><g><path d="M 478 108 L 550 108 L 550 255 L 583 255" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F3)" stroke-linejoin="round" stroke-linecap="round"></path><text x="514" y="91.5" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">考生进入并核验身</text><text x="514" y="106.5" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">份</text><path d="M 838 255 L 899 255" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F3)" stroke-linejoin="round" stroke-linecap="round"></path><path d="M 1242 255 L 1303 255" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F3)" stroke-linejoin="round" stroke-linecap="round"></path><text x="1276" y="246" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">满足核验要求</text><path d="M 1242 255 L 1270 255 L 1270 435 L 1303 435" fill="none" stroke="#7345AC" stroke-width="2.1" stroke-dasharray="8 5" marker-end="url(#ar-u-F3)" stroke-linejoin="round" stroke-linecap="round"></path><text x="1268.75" y="246" fill="#5C3487" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">未通过</text><path d="M 1558 255 L 1619 255" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F3)" stroke-linejoin="round" stroke-linecap="round"></path></g><g><path d="M 226 108 L 228 108" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F3)" stroke-linecap="round"></path><path d="M 1962 255 L 1984 255" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F3)" stroke-linecap="round"></path><path d="M 1962 255 L 1984 255" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F3)" stroke-linecap="round"></path></g><g><g class="node cfm" data-id="F3-06"><rect x="230" y="69" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="354" y="92" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">使用 PC、平板或手机进入</text><text x="354" y="112" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">对应考试</text><text x="240" y="135" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-06</text><text x="468" y="135" fill="#7345AC" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-Q7</text></g><g class="node cfm" data-id="F3-07"><rect x="590" y="216" width="248" height="78" rx="9" fill="#DFF2ED" stroke="#0E7A6A" stroke-width="2.2"></rect><text x="714" y="249" fill="#053A31" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">采集人脸并完成考前身份核验</text><text x="600" y="282" fill="#0E7A6A" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-07</text><text x="828" y="282" fill="#0E7A6A" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">系统</text></g><g class="node cfm" data-id="F3-D1"><polygon points="906,255 1074,183 1242,255 1074,327" fill="#FFF3DC" stroke="#C07C08" stroke-width="2.2"></polygon><text x="1074" y="251" fill="#5C3A00" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">考生身份核验是否满足要求？</text><text x="1074" y="319" fill="#C07C08" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-D1</text><text x="1074" y="299" fill="#7345AC" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-Q2</text></g><g class="node unc" data-id="F3-U1"><rect x="1310" y="396" width="248" height="78" rx="9" fill="#F4EBFC" stroke="#7345AC" stroke-width="2.2" stroke-dasharray="10 6"></rect><text x="1434" y="429" fill="#3C1C61" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">核验失败处理方式待确认</text><text x="1320" y="462" fill="#7345AC" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-U1</text><text x="1548" y="462" fill="#7345AC" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-Q2</text></g><g class="node cfm" data-id="F3-08"><rect x="1310" y="216" width="248" height="78" rx="9" fill="#DFF2ED" stroke="#0E7A6A" stroke-width="2.2"></rect><text x="1434" y="249" fill="#053A31" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">检查 IP 范围及入场时间</text><text x="1320" y="282" fill="#0E7A6A" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-08</text><text x="1548" y="282" fill="#0E7A6A" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">系统</text></g><g class="node cfm" data-id="F3-D2"><polygon points="1626,255 1794,183 1962,255 1794,327" fill="#FFF3DC" stroke="#C07C08" stroke-width="2.2"></polygon><text x="1794" y="241" fill="#5C3A00" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">是否位于允许 IP 范围且未</text><text x="1794" y="261" fill="#5C3A00" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">迟到超过 30 分钟？</text><text x="1794" y="319" fill="#C07C08" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-D2</text><text x="1794" y="299" fill="#7345AC" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-Q4</text></g></g><line x1="222" y1="6" x2="222" y2="534" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><line x1="1988" y1="6" x2="1988" y2="534" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><text x="228" y="16" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">◀ 本段起点（第 2 段）</text><text x="1982" y="16" fill="#A0520A" font-size="13" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">本段终点 ▶</text><text x="228" y="42" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600" letter-spacing="0">本段衔接：上线 ← F3-05（第1段）　｜　下线 → F3-09（第3段）、F3-T1（第3段）</text><rect x="0" y="709" width="2006" height="30" fill="#F4F2ED"></rect><text x="216" y="724" fill="#6B7480" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">本段未参与（为便于阅读已隐藏）：集团 HR 及原考务系统、考试管理人员、身份核验服务、F4 阅卷核分与结果处理</text></g></svg>
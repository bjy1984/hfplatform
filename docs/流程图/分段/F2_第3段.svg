 L 184 141" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F2)" stroke-linecap="round"></path><path d="M 1918 483 L 1984 483" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F2)" stroke-linecap="round"></path></g><g><g class="node cfm" data-id="F2-D2"><polygon points="186,141 354,69 522,141 354,213" fill="#FFF3DC" stroke="#C07C08" stroke-width="2.2"></polygon><text x="354" y="137" fill="#5C3A00" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">采用固定组卷还是随机组卷？</text><text x="354" y="205" fill="#C07C08" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="700" letter-spacing="0">F2-D2</text></g><g class="node cfm" data-id="F2-11"><rect x="590" y="102" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="714" y="135" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">精准检索并手动选择试题</text><text x="600" y="168" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F2-11</text></g><g class="node cfm" data-id="F2-12"><rect x="590" y="264" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="714" y="287" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">配置随机抽题的覆盖度与分布</text><text x="714" y="307" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">要求</text><text x="600" y="330" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F2-12</text></g><g class="node cfm" data-id="F2-13"><rect x="950" y="444" width="248" height="78" rx="9" fill="#DFF2ED" stroke="#0E7A6A" stroke-width="2.2"></rect><text x="1074" y="467" fil
.4"></line><text x="104" y="288" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">成绩及归档业务使用者／考</text><text x="104" y="306" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">生</text><rect x="0" y="354" width="1646" height="114" fill="#FFFFFF"></rect><rect x="0" y="354" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="354" x2="1646" y2="354" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="402" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">集团职业技能等级认定信息</text><text x="104" y="420" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">管理系统</text><line x1="208" y1="60" x2="208" y2="468" stroke="#DEDBD4" stroke-width="1.4"></line><line x1="0" y1="468" x2="1646" y2="468" stroke="#DEDBD4" stroke-width="1.4"></line></g><g><rect x="0" y="526" width="1646" height="64" fill="#FFF2E0" stroke="#E0A162" stroke-width="1.6"></rect><text x="14" y="558" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">全程横向带</text><text x="216" y="547" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">按试题、专家、评分组监控进度｜判分质量与效率统计｜任务分配和调整追溯｜阅卷及考核多维统计｜判分结果开放｜电子签字留痕（2.3.18—19、2.4.8）</text><text x="216" y="569" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜管理指标和任务状态实时呈现，不放到全部阅卷结束后才查看；评分组是组织单元，不能自动新增“评分组长”审批节点</text></g><g><path d="M 478 141 L 1270 141 L 1270 288 L 1303 288" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F4)" stroke-linejoin="round" stroke-linecap="round"></path><path d="M 838 288 L 854 288 L 854 331 L 1294 331 L 1294 288 L 1303 288" fill="none" stroke="#49535F
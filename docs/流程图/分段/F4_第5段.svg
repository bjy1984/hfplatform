ing="0">形成并提供个人成绩与分析报</text><text x="714" y="292" fill="#053A31" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">告</text><text x="600" y="315" fill="#0E7A6A" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-20</text><text x="828" y="315" fill="#7345AC" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-Q9</text></g><g class="node cfm" data-id="F4-21"><rect x="950" y="102" width="248" height="78" rx="9" fill="#DFF2ED" stroke="#0E7A6A" stroke-width="2.2"></rect><text x="1074" y="125" fill="#053A31" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">归档无纸化考试数据并支持下</text><text x="1074" y="145" fill="#053A31" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">载</text><text x="960" y="168" fill="#0E7A6A" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-21</text><text x="1188" y="168" fill="#0E7A6A" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">系统</text></g><g class="node cfm" data-id="F4-22"><rect x="950" y="363" width="248" height="78" rx="9" fill="#E9EBF9" stroke="#4A51AE" stroke-width="2.2"></rect><text x="1074" y="386" fill="#20245F" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">自动回传客观分、主观核分结</text><text x="1074" y="406" fill="#20245F" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">果及总成绩</text><text x="960" y="429" fill="#4A51AE" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-22</text><text x="1188" y="429" fill="#7345AC" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-Q9</text></g><g class="node cfm" data-id="F4-E"><rect x="1310" y="249" width="248" height="78" rx="39" fill="#DCEBE5" stroke="#256352" stroke-width="2.2"></rect><text x="1434" y="272" fill="#123028" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">成绩、报告、归档及回传按确</text><text x="1434" y="292" fill="#123028" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">认规则完成</text><text x="1320" y="315" fill="#256352" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-E</text></g></g><line x1="222" y1="6" x2="222" y2="468" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><line x1="1628" y1="6" x2="1628" y2="468" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><text x="228" y="16" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">◀ 本段起点（第 5 段）</text><text x="1622" y="16" fill="#A0520A" font-size="13" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">本段终点 ▶</text><text x="228" y="42" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600" letter-spacing="0">本段衔接：上线 ← F4-18（第4段）　｜　下线 → 无</text><rect x="0" y="599" width="1646" height="30" fill="#F4F2ED"></rect><text x="216" y="614" fill="#6B7480" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">本段未参与（为便于阅读已隐藏）：阅卷组织管理人员、阅卷专家／评分人员、按试题设置的仲裁人员</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2006 654" width="2006" height="654" font-family="&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif"><defs><marker id="ar-n-F4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#49535F"></path></marker><marker id="ar-b-F4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A0"></path></marker><marker id="ar-u-F4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7345AC"></path></marker><marker id="ar-s-F4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2610C"></path></marker></defs><rect x="0" y="0" width="2006" height="654" fill="#ffffff"></rect><text x="18" y="32" font-size="19" font-weight="700" fill="#1F2328">F4　客观判分、主观阅卷、差值仲裁与成绩处理流程　第 4 段</text><text x="1988" y="32" font-size="13" fill="#7A828C" text-anchor="end">第 4 / 5 段（F4-15 — F4-18） · 节点 5 · 本段未参与泳道已隐藏 · 核对稿 2026-09-21</text><line x1="0" y1="42" x2="2006" y2="42" stroke="#DEDBD4" stroke-width="2"></line><g transform="translate(0,48)"><g><rect x="0" y="60" width="2006" height="180" fill="#FFFFFF"></rect><rect x="0" y="60" width="208" height="180" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="60" x2="2006" y2="60" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="150" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">考试系统／系统自动处理</text><rect x="0" y="240" width="2006" height="180" fill="#FBF9F6"></rect><rect x="0" y="240" width="208" height="180" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="240" x2="2006" y2="240" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="330" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">按试题设置的仲裁人员</text><line x1="208" y1="60" x2="208" y2="420" stroke="#DEDBD4" stroke-width="1.4"></line><line x1="0" y1="420" x2="2006" y2="420" stroke="#DEDBD4" stroke-width="1.4"></line></g><g><rect x="0" y="478" width="2006" height="64" fill="#FFF2E0" stroke="#E0A162" stroke-width="1.6"></rect><text x="14" y="510" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">全程横向带</text><text x="216" y="499" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">按试题、专家、评分组监控进度｜判分质量与效率统计｜任务分配和调整追溯｜阅卷及考核多维统计｜判分结果开放｜电子签字留痕（2.3.18—19、2.4.8）</text><text x="216" y="521" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜管理指标和任务状态实时呈现，不放到全部阅卷结束后才查看；评分组是组织单元，不能自动新增“评分组长”审批节点</text></g><g><path d="M 478 321 L 539 321" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F4)" stroke-linejoin="round" stroke-linecap="round"></path><path d="M 882 321 L 943 321" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F4)" stroke-linejoin="round" stroke-linecap="round"></path><text x="916" y="312" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">退回处置</text><path d="M 882 321 L 898 321 L 898 397 L 1294 397 L 1294 321 L 1303 321" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F4)" stroke-linejoin="round" stroke-linecap="round"></path><text x="1096" y="406" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">直接仲裁</text><path d="M 1558 321 L 1630 321 L 1630 141 L 1663 141" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F4)" stroke-linejoin="round" stroke-linecap="round"></path></g><g><path d="M 226 141 L 1668 141" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F4)" stroke-linecap="round"></path><path d="M 226 141 L 1668 141" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F4)" stroke-linecap="round"></path><path d="M 226 321 L 228 321" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F4)" stroke-linecap="round"></path><path d="M 950 321 L 226 321" fill="none" stroke="#7345AC" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-u-F4)" stroke-linecap="round"></path><path d="M 1918 141 L 1984 141" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F4)" stroke-linecap="round"></path><path d="M 1918 141 L 1984 141" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F4)" stroke-linecap="round"></path><path d="M 1918 141 L 1984 141" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F4)" stroke-linecap="round"></path><path d="M 1918 141 L 1984 141" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F4)" stroke-linecap="round"></path></g><g><g class="node cfm" data-id="F4-15"><rect x="230" y="282" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="354" y="315" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">查看争议评分及相关评阅材料</text><text x="240" y="348" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-15</text></g><g class="node cfm" data-id="F4-D4"><polygon points="546,321 714,249 882,321 714,393" fill="#FFF3DC" stroke="#C07C08" stroke-width="2.2"></polygon><text x="714" y="317" fill="#5C3A00" font-size="15" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">采用退回处置还是直接仲裁？</text><text x="714" y="385" fill="#C07C08" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-D4</text></g><g class="node cfm" data-id="F4-16"><rect x="950" y="282" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="1074" y="305" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">退回处置并按确认规则重新组</text><text x="1074" y="325" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">织评阅</text><text x="960" y="348" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-16</text><text x="1188" y="348" fill="#7345AC" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-Q7</text></g><g class="node cfm" data-id="F4-17"><rect x="1310" y="282" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="1434" y="315" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">直接仲裁并形成处理结果</text><text x="1320" y="348" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-17</text><text x="1548" y="348" fill="#7345AC" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-Q7</text></g><g class="node cfm" data-id="F4-18"><rect x="1670" y="102" width="248" height="78" rx="9" fill="#DFF2ED" stroke="#0E7A6A" stroke-width="2.2"></rect><text x="1794" y="125" fill="#053A31" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">形成主观核分结果并汇总考试</text><text x="1794" y="145" fill="#053A31" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">成绩</text><text x="1680" y="168" fill="#0E7A6A" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-18</text><text x="1908" y="168" fill="#0E7A6A" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">系统</text></g></g><line x1="222" y1="6" x2="222" y2="420" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><line x1="1988" y1="6" x2="1988" y2="420" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><text x="228" y="16" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">◀ 本段起点（第 4 段）</text><text x="1982" y="16" fill="#A0520A" font-size="13" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">本段终点 ▶</text><text x="228" y="42" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600" letter-spacing="0">本段衔接：上线 ← F4-D1（第1段）、F4-13（第3段）、F4-14（第3段）　｜　下线 → F4-07（第2段）、F4-19（第5段）、F4-20（第5段）、F4-21（第5段） 等共 5 条</text><rect x="0" y="551" width="2006" height="30" fill="#F4F2ED"></rect><text x="216" y="566" fill="#6B7480" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">本段未参与（为便于阅读已隐藏）：阅卷组织管理人员、阅卷专家／评分人员、成绩及归档业务使用者／考生、集团职业技能等级认定信息管理系统</text></g></svg>
th="1.4"></line><text x="104" y="231" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">考点准备人员</text><rect x="0" y="288" width="2006" height="114" fill="#FFFFFF"></rect><rect x="0" y="288" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="288" x2="2006" y2="288" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="345" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">考生</text><rect x="0" y="402" width="2006" height="114" fill="#FBF9F6"></rect><rect x="0" y="402" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="402" x2="2006" y2="402" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="459" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">现场技能评分人员</text><rect x="0" y="516" width="2006" height="114" fill="#FFFFFF"></rect><rect x="0" y="516" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="516" x2="2006" y2="516" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="573" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">系统自动处理</text><line x1="208" y1="60" x2="208" y2="630" stroke="#DEDBD4" stroke-width="1.4"></line><line x1="0" y1="630" x2="2006" y2="630" stroke="#DEDBD4" stroke-width="1.4"></line></g><g><rect x="0" y="688" width="2006" height="64" fill="#FFF2E0" stroke="#E0A162" stroke-width="1.6"></rect><text x="14" y="720" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">全程横向带</text><text x="216" y="709" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">技能试题资料包（试题正文、考生准备、考场准备、考核过程要求、考核结果要求、评分标准表）｜考务及评分关系（考核批次、工种、
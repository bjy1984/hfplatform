<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2006 588" width="2006" height="588" font-family="&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif"><defs><marker id="ar-n-F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#49535F"></path></marker><marker id="ar-b-F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A0"></path></marker><marker id="ar-u-F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7345AC"></path></marker><marker id="ar-s-F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2610C"></path></marker></defs><rect x="0" y="0" width="2006" height="588" fill="#ffffff"></rect><text x="18" y="32" font-size="19" font-weight="700" fill="#1F2328">F1　题库开发与修订入库流程　第 1 段</text><text x="1988" y="32" font-size="13" fill="#7A828C" text-anchor="end">第 1 / 6 段（F1-S — F1-04） · 节点 5 · 本段未参与泳道已隐藏 · 核对稿 2026-09-21</text><line x1="0" y1="42" x2="2006" y2="42" stroke="#DEDBD4" stroke-width="2"></line><g transform="translate(0,48)"><g><rect x="0" y="60" width="2006" height="114" fill="#FFFFFF"></rect><rect x="0" y="60" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="60" x2="2006" y2="60" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="108" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">题库开发组织方／管理端操</text><text x="104" y="126" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">作人员</text><rect x="0" y="174" width="2006" height="180" fill="#FBF9F6"></rect><rect x="0" y="174" width="208" height="180" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="174" x2="2006" y2="174" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="264" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">系统自动处理</text><line x1="208" y1="60" x2="208" y2="354" stroke="#DEDBD4" stroke-width="1.4"></line><line x1="0" y1="354" x2="2006" y2="354" stroke="#DEDBD4" stroke-width="1.4"></line></g><g><rect x="0" y="412" width="2006" height="64" fill="#FFF2E0" stroke="#E0A162" stroke-width="1.6"></rect><text x="14" y="444" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">全程横向带</text><text x="216" y="433" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">实时任务进度跟踪｜历史任务查询｜全过程日志与数据溯源｜分级权限与加密保护</text><text x="216" y="455" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜命题质量、专家绩效、计划完成情况统计导出（统计须包含命题时间、总命制量、退回试题数、命题通过率及历次任务综合表现；通过率和时间计算口径待确认，不自行设定考核阈值）</text></g><g><path d="M 478 108 L 583 108" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F1)" stroke-linejoin="round" stroke-linecap="round"></path><path d="M 478 108 L 494 108 L 494 151 L 934 151 L 934 108 L 943 108" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F1)" stroke-linejoin="round" stroke-linecap="round"></path><path d="M 838 108 L 854 108 L 854 156 L 1294 156 L 1294 108 L 1303 108" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F1)" stroke-linejoin="round" stroke-linecap="round"></path><text x="1074" y="165" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">准备命题基础，制定计划</text><path d="M 1198 108 L 1303 108" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F1)" stroke-linejoin="round" stroke-linecap="round"></path><path d="M 1558 108 L 1630 108 L 1630 255 L 1663 255" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F1)" stroke-linejoin="round" stroke-linecap="round"></path><text x="1594" y="99" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">匹配并分配任务</text></g><g><path d="M 1918 255 L 1984 255" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F1)" stroke-linecap="round"></path></g><g><g class="node cfm" data-id="F1-S"><rect x="230" y="69" width="248" height="78" rx="39" fill="#E7F5E2" stroke="#357E38" stroke-width="2.2"></rect><text x="354" y="102" fill="#173F19" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">接到题库开发或修订需求</text><text x="240" y="135" fill="#357E38" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F1-S</text></g><g class="node cfm" data-id="F1-01"><rect x="590" y="69" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="714" y="92" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">维护职业工种、技能等级及多</text><text x="714" y="112" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">层级科目体系</text><text x="600" y="135" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F1-01</text></g><g class="node cfm" data-id="F1-02"><rect x="950" y="69" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="1074" y="92" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">维护专家信息、职责授权及历</text><text x="1074" y="112" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">次任务表现</text><text x="960" y="135" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F1-02</text></g><g class="node cfm" data-id="F1-03"><rect x="1310" y="69" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="1434" y="102" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">制定并发布命题计划</text><text x="1320" y="135" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F1-03</text></g><g class="node cfm" data-id="F1-04"><rect x="1670" y="216" width="248" height="78" rx="9" fill="#DFF2ED" stroke="#0E7A6A" stroke-width="2.2"></rect><text x="1794" y="249" fill="#053A31" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">智能匹配专家资源</text><text x="1680" y="282" fill="#0E7A6A" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F1-04</text><text x="1908" y="282" fill="#0E7A6A" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">系统</text></g></g><line x1="222" y1="6" x2="222" y2="354" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><line x1="1988" y1="6" x2="1988" y2="354" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><text x="228" y="16" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">◀ 本段起点（第 1 段）</text><text x="1982" y="16" fill="#A0520A" font-size="13" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">本段终点 ▶</text><text x="228" y="42" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600" letter-spacing="0">本段衔接：上线 ← 无　｜　下线 → F1-05（第2段）</text><rect x="0" y="485" width="2006" height="30" fill="#F4F2ED"></rect><text x="216" y="500" fill="#6B7480" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">本段未参与（为便于阅读已隐藏）：命题负责人、命题专家、初审人员、复审人员、终审人员、获授权的任务特批／入库操作人员、外部／关联系统</text></g></svg>
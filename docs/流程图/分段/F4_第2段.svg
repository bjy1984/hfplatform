874" y="286.5" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">务</text><path d="M 1198 141 L 1270 141 L 1270 402 L 1303 402" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F4)" stroke-linejoin="round" stroke-linecap="round"></path><path d="M 1794 102 L 1794 18 L 1270 18 L 1270 339 L 1434 339 L 1434 356" fill="none" stroke="#7345AC" stroke-width="2.1" stroke-dasharray="8 5" marker-end="url(#ar-u-F4)" stroke-linejoin="round" stroke-linecap="round"></path><text x="1532" y="2.5" fill="#5C3487" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">按确认范围与时点</text><text x="1532" y="17.5" fill="#5C3487" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">开放系统判分结果</text><path d="M 1558 402 L 1663 402" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F4)" stroke-linejoin="round" stroke-linecap="round"></path><text x="1614" y="393" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">提交评分</text></g><g><path d="M 226 288 L 228 288" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F4)" stroke-linecap="round"></path><path d="M 226 141 L 948 141" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F4)" stroke-linecap="round"></path><path d="M 1918 402 L 1984 402" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F4)" stroke-linecap="round"></path><path d="M 1984 402 L 1560 402
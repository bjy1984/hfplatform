r="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">判分完成后电子签字留痕</text><text x="1680" y="429" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F4-11</text></g></g><line x1="222" y1="6" x2="222" y2="468" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><line x1="1988" y1="6" x2="1988" y2="468" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><text x="228" y="16" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">◀ 本段起点（第 2 段）</text><text x="1982" y="16" fill="#A0520A" font-size="13" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">本段终点 ▶</text><text x="228" y="42" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600" letter-spacing="0">本段衔接：上线 ← F4-05（第1段）、F4-D1（第1段）、F4-D2（第3段）、F4-16（第4段）　｜　下线 → F4-D2（第3段）</text><rect x="0" y="599" width="2006" height="30" fill="#F4F2ED"></rect><text x="216" y="614" fill="#6B7480" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">本段未参与（为便于阅读已隐藏）：按试题设置的仲裁人员、成绩及归档业务使用者／考生、集团职业技能等级认定信息管理系统</text></g></svg>
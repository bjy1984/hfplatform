ght="700" letter-spacing="0">F1-E</text></g><g class="node cfm" data-id="F1-23"><rect x="950" y="69" width="248" height="78" rx="9" fill="#E4EFFA" stroke="#1C6FB0" stroke-width="2.2"></rect><text x="1074" y="92" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">发起已入库试题修订并重新审</text><text x="1074" y="112" fill="#08304C" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">核</text><text x="960" y="135" fill="#1C6FB0" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F1-23</text></g></g><line x1="222" y1="6" x2="222" y2="402" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><line x1="1268" y1="6" x2="1268" y2="402" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><text x="228" y="16" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">◀ 本段起点（第 6 段）</text><text x="1262" y="16" fill="#A0520A" font-size="13" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">本段终点 ▶</text><text x="228" y="42" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600" letter-spacing="0">本段衔接：上线 ← F1-21（第5段）　｜　下线 → F1-07（第2段）</text><rect x="0" y="555" width="1286" height="30" fill="#F4F2ED"></rect><text x="216" y="570" fill="#6B7480" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">本段未参与（为便于阅读已隐藏）：题库开发组织方／管理端操作人员、命题负责人、初审人员、复审人员、终审人员、系统自动处理</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1286 658" width="1286" height="658" font-family="&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif"><defs><marker id="ar-n-F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#49535F"></path></marker><marker id="ar-b-F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A0"></path></marker><marker id="ar-u-F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7345AC"></path></marker><marker id="ar-s-F1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2610C"></path></marker></defs><rect x="0" y="0" width="1286" height="658" fill="#ffffff"></rect><text x="18" y="32" font-size="19" font-weight="700" fill="#1F2328">F1　题库开发与修订入库流程　第 6 段</text><text x="1268" y="32" font-size="13" fill="#7A828C" text-anchor="end">第 6 / 6 段（F1-22 — F1-23） · 节点 3 · 本段未参与泳道已隐藏 · 核对稿 2026-09-21</text><line x1="0" y1="42" x2="1286" y2="42" stroke="#DEDBD4" stroke-width="2"></line><g transform="translate(0,48)"><g><rect x="0" y="60" width="1286" height="114" fill="#FFFFFF"></rect><rect x="0" y="60" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="60" x2="1286" y2="60" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="117" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">命题专家</text><rect x="0" y="174" width="1286" height="114" fill="#FBF9F6"></rect><rect x="0" y="174" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="174" x2="1286" y2="174" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="222" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">获授权的任务特批／入库操</text><text x="104" y="240" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">作人员</text><rect x="0" y="288" width="1286" height="114" fill="#FFFFFF"></rect><rect x="0" y="288" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="288" x2="1286" y2="288" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="345" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">外部／关联系统</text><line x1="208" y1="60" x2="208" y2="402" stroke="#DEDBD4" stroke-width="1.4"></line><line x1="0" y1="402" x2="1286" y2="402" stroke="#DEDBD4" stroke-width="1.4"></line></g><g><rect x="0" y="460" width="1286" height="86" fill="#FFF2E0" stroke="#E0A162" stroke-width="1.6"></rect><text x="14" y="503" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">全程横向带</text><text x="216" y="481" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">实时任务进度跟踪｜历史任务查询｜全过程日志与数据溯源｜分级权限与加密保护</text><text x="216" y="503" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜命题质量、专家绩效、计划完成情况统计导出（统计须包含命题时间、总命制量、退回试题数、命题通过率及历次任务综合表现；通过率和时间计算口</text><text x="216" y="525" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">径待确认，不自行设定考核阈值）</text></g><g><path d="M 478 336 L 550 336 L 550 222 L 583 222" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F1)" stroke-linejoin="round" stroke-linecap="round"></path><path d="M 838 222 L 910 222 L 910 108 L 943 108" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F1)" stroke-linejo
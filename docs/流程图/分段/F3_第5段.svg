<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1286 724" width="1286" height="724" font-family="&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif"><defs><marker id="ar-n-F3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#49535F"></path></marker><marker id="ar-b-F3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A0"></path></marker><marker id="ar-u-F3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7345AC"></path></marker><marker id="ar-s-F3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2610C"></path></marker></defs><rect x="0" y="0" width="1286" height="724" fill="#ffffff"></rect><text x="18" y="32" font-size="19" font-weight="700" fill="#1F2328">F3　无纸化理论考试组织、核验、作答与交卷流程　第 5 段</text><text x="1268" y="32" font-size="13" fill="#7A828C" text-anchor="end">第 5 / 5 段（F3-18 — F3-E） · 节点 4 · 本段未参与泳道已隐藏 · 核对稿 2026-09-21</text><line x1="0" y1="42" x2="1286" y2="42" stroke="#DEDBD4" stroke-width="2"></line><g transform="translate(0,48)"><g><rect x="0" y="60" width="1286" height="114" fill="#FFFFFF"></rect><rect x="0" y="60" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="60" x2="1286" y2="60" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="117" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">考生</text><rect x="0" y="174" width="1286" height="114" fill="#FBF9F6"></rect><rect x="0" y="174" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="174" x2="1286" y2="174" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="231" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">身份核验服务</text><rect x="0" y="288" width="1286" height="114" fill="#FFFFFF"></rect><rect x="0" y="288" width="208" height="114" fill="#F4F2ED" stroke="#DEDBD4" stroke-width="1.4"></rect><line x1="0" y1="288" x2="1286" y2="288" stroke="#DEDBD4" stroke-width="1.4"></line><text x="104" y="345" fill="#2E3742" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="600" letter-spacing="0">F4 阅卷核分与结果处理</text><line x1="208" y1="60" x2="208" y2="402" stroke="#DEDBD4" stroke-width="1.4"></line><line x1="0" y1="402" x2="1286" y2="402" stroke="#DEDBD4" stroke-width="1.4"></line></g><g><rect x="0" y="460" width="1286" height="152" fill="#FFF2E0" stroke="#E0A162" stroke-width="1.6"></rect><text x="14" y="536" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">全程横向带</text><text x="216" y="481" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">本人核验（考前／考中／考后人脸识别，间隔可配置，手机同步，公安接口可对接）</text><text x="216" y="503" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜访问与时间控制（指定 IP、迟到 30 分钟禁考、开考 15 分钟禁交、考试倒计时）</text><text x="216" y="525" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜考试环境控制（限制离开考试环境、禁止打开非考试相关软件、防切屏／防截屏／防录屏／防远程控制／防可疑软件）</text><text x="216" y="547" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜试题控制（禁止复制试卷内容、机位自动绑定、题序与选项乱序）</text><text x="216" y="569" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜输入及交互（微软／谷歌／搜狗拼音、极品五笔、万能五笔等主流输入法；字号、计算器、标记、多次交卷确认及签字）</text><text x="216" y="591" fill="#7A3F04" font-size="15" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">｜异常连续性（保留作答、断点续考，覆盖手机端）｜容量旁注：至少 2000 人同时在线访问及考试（并发是性能验收约束，不是流程节点）</text></g><g><path d="M 478 336 L 550 336 L 550 108 L 583 108" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F3)" stroke-linejoin="round" stroke-linecap="round"></path><text x="514" y="327" fill="#333D49" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round">F4 结果回填</text><path d="M 838 108 L 910 108 L 910 336 L 943 336" fill="none" stroke="#49535F" stroke-width="2.1" marker-end="url(#ar-n-F3)" stroke-linejoin="round" stroke-linecap="round"></path></g><g><path d="M 226 336 L 228 336" fill="none" stroke="#C2610C" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-s-F3)" stroke-linecap="round"></path><path d="M 226 222 L 228 222" fill="none" stroke="#7345AC" stroke-width="2.1" stroke-dasharray="11 6" marker-end="url(#ar-u-F3)" stroke-linecap="round"></path></g><g><g class="node cfm" data-id="F3-18"><rect x="230" y="183" width="248" height="78" rx="9" fill="#DFF2ED" stroke="#0E7A6A" stroke-width="2.2"></rect><text x="354" y="216" fill="#053A31" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">支持考后人脸识别</text><text x="240" y="249" fill="#0E7A6A" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-18</text><text x="468" y="249" fill="#7345AC" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-Q2</text></g><g class="node cfm" data-id="X-F4"><rect x="230" y="297" width="248" height="78" rx="9" fill="#E9EBF9" stroke="#4A51AE" stroke-width="2.2"></rect><text x="354" y="320" fill="#20245F" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">→ F4 阅卷核分与结果处</text><text x="354" y="340" fill="#20245F" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">理</text><text x="240" y="363" fill="#4A51AE" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">X-F4</text><text x="468" y="363" fill="#4A51AE" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">关联</text></g><g class="node cfm" data-id="F3-19"><rect x="590" y="69" width="248" height="78" rx="9" fill="#DFF2ED" stroke="#0E7A6A" stroke-width="2.2"></rect><text x="714" y="92" fill="#053A31" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">提供可获取的成绩及个人分析</text><text x="714" y="112" fill="#053A31" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">报告</text><text x="600" y="135" fill="#0E7A6A" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-19</text><text x="828" y="135" fill="#7345AC" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-Q6</text></g><g class="node cfm" data-id="F3-E"><rect x="950" y="297" width="248" height="78" rx="39" fill="#DCEBE5" stroke="#256352" stroke-width="2.2"></rect><text x="1074" y="320" fill="#123028" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">本次作答结束，转入核分、报</text><text x="1074" y="340" fill="#123028" font-size="15.5" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="0">告与归档</text><text x="960" y="363" fill="#256352" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">F3-E</text></g></g><line x1="222" y1="6" x2="222" y2="402" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><line x1="1268" y1="6" x2="1268" y2="402" stroke="#C2610C" stroke-width="2" stroke-dasharray="12 7" opacity="0.5"></line><text x="228" y="16" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="700" letter-spacing="0">◀ 本段起点（第 5 段）</text><text x="1262" y="16" fill="#A0520A" font-size="13" text-anchor="end" dominant-baseline="middle" font-weight="700" letter-spacing="0">本段终点 ▶</text><text x="228" y="42" fill="#A0520A" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600" letter-spacing="0">本段衔接：上线 ← F3-17（第4段）　｜　下线 → 无</text><rect x="0" y="621" width="1286" height="30" fill="#F4F2ED"></rect><text x="216" y="636" fill="#6B7480" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="400" letter-spacing="0">本段未参与（为便于阅读已隐藏）：集团 HR 及原考务系统、考试管理人员、系统自动处理／受控考试环境、异常处理责任人员</text></g></svg>